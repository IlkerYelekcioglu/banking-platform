services:

  postgres-customer:
    image: postgres:16
    container_name: bankcore-customer-postgres

    environment:
      POSTGRES_DB: customer_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"

    volumes:
      - customer_postgres_data:/var/lib/postgresql/data

volumes:
  customer_postgres_data: